<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100vw;
      background-image: url('https://cdn.phototourl.com/free/2026-09-21-c418ba7e-4e91-4684-90f0-32c6ccc9947a.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      display: flex;
      justify-content: center;
      align-items: center;

    .card-container {

      border-radius: 20px;        
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); 
      
      padding: 30px; 
      box-sizing: border-box;

</head>
<body>

  <div class="card-container">

</body>
</html>
